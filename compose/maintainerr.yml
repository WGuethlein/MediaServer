# Maintainerr — rule-based cleanup of unwatched media (Plex + Seerr + Sonarr/Radarr + Tautulli). Added 2026-10-11.
# Starts SAFE: every rule = "Do nothing" + "keep in Maintainerr only"; no media path mounted (it can't delete files
# itself — only via Sonarr/Radarr if a rule is later switched to a delete action).
# 3.30.1 pinned on purpose (< 2 weeks old): fixes Seerr requests being deleted while seasons are still on disk.
services:
  maintainerr:
    container_name: maintainerr
    image: ghcr.io/maintainerr/maintainerr:3.31.0
    restart: unless-stopped
    user: ${PUID}:${PGID}
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - t3_proxy
    environment:
      TZ: ${TZ}
      TELEMETRY: "off"
    volumes:
      - ${DOCKERDIR}/appdata/maintainerr:/opt/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=t3_proxy
      - traefik.http.routers.maintainerr-rtr.entrypoints=websecure
      - traefik.http.routers.maintainerr-rtr.rule=Host(`maintainerr.${DOMAINNAME_1}`)
      - traefik.http.routers.maintainerr-rtr.middlewares=chain-tinyauth-lan@file
      - traefik.http.routers.maintainerr-rtr.service=maintainerr-svc
      - traefik.http.services.maintainerr-svc.loadbalancer.server.port=6246
