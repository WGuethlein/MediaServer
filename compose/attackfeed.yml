# Attack feed — public, scrubbed live view of honeypot/firewall/scanner events. Added 2026-10-11.
#  v2: incremental 7-day store, insights, sessions; docs/honeypot.md
#  - attackfeed-gen: every 20 s queries Loki on wyatt-mon, writes feed/live/insights/sessions JSON (no home/LAN details).
#  - attackfeed: nginx serving those + the page at https://attacks.geet.dev/<token>/ (token: secrets/attackfeed_token)
services:
  attackfeed-gen:
    container_name: attackfeed-gen
    image: python:3.13.7-alpine3.22
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    mem_limit: 512m          # one cycle peaks ~120 MiB on a full 7-day store (tests/memcheck.py)
    networks:
      - default           # reaches Loki at 192.168.1.73:3100
    command: ["python3", "-u", "-m", "attackfeed"]
    working_dir: /app
    volumes:
      - ${DOCKERDIR}/honeypot/attackfeed:/app/attackfeed:ro
      - ${DOCKERDIR}/honeypot/map.html:/app/map.html:ro
      - ${DOCKERDIR}/appdata/attackfeed:/out
      - ${DOCKERDIR}/appdata/attackfeed-state:/state          # 7-day SQLite store; NOT served by nginx
      - ${DOCKERDIR}/appdata/cowrie/var/lib/cowrie/tty:/tty:ro  # Cowrie session recordings
    secrets:
      - attackfeed_token
    environment:
      LOKI_URL: http://192.168.1.73:3100
      INTERVAL: "20"            # seconds between feed rebuilds (page polls every 15 s)
      TOKEN_FILE: /run/secrets/attackfeed_token
      PYTHONDONTWRITEBYTECODE: "1"
      MAX_EVENTS: "6000"
      HISTORY_DAYS: "7"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  attackfeed:
    container_name: attackfeed
    image: nginxinc/nginx-unprivileged:1.29.1-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    networks:
      - t3_proxy
    volumes:
      - ${DOCKERDIR}/honeypot/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DOCKERDIR}/appdata/attackfeed:/srv:ro
    tmpfs:
      - /tmp:size=8m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.attackfeed-rtr.entrypoints=websecure"
      - "traefik.http.routers.attackfeed-rtr.rule=Host(`attacks.${DOMAINNAME_1}`)"
      - "traefik.http.routers.attackfeed-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.attackfeed-rtr.service=attackfeed-svc"
      - "traefik.http.services.attackfeed-svc.loadbalancer.server.port=8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

secrets:
  attackfeed_token:
    file: ${DOCKERDIR}/secrets/attackfeed_token
