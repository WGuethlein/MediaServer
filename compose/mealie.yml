services:
  mealie:
    container_name: mealie
    image: ghcr.io/mealie-recipes/mealie:v3.16.0
    restart: unless-stopped
    mem_limit: ${MEALIE_MEMORY}    # honors the MEALIE_MEMORY knob from .env
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: ${MEALIE_IP}
      t3_proxy:
    # No published port — Traefik only
    volumes:
      - ${DOCKERDIR}/appdata/mealie:/app/data
    environment:
      TZ: ${TZ}
      ALLOW_SIGNUP: ${MEALIE_ALLOW_SIGNUP}
      BASE_URL: ${MEALIE_BASE_URL}
      # Database: SQLite (default, no env needed). For Postgres, add DB_ENGINE=postgres + creds.
      # OIDC via tinyauth (Google login), 2026-10-11. Users are matched by email (OIDC_USER_CLAIM default).
      # Google has no groups, so no OIDC_USER_GROUP/OIDC_ADMIN_GROUP; existing admin flags in Mealie are kept.
      # Who may log in is decided by the tinyauth whitelist. Local login fallback: https://food.geet.dev/login?direct=1
      OIDC_AUTH_ENABLED: "true"
      OIDC_CONFIGURATION_URL: https://${TINYAUTH_SUBDOMAIN}.${DOMAINNAME_1}/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${TINYAUTH_MEALIE_CLIENT_ID}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/tinyauth_mealie_oidc_secret
      OIDC_PROVIDER_NAME: Google
      OIDC_AUTO_REDIRECT: "false"      # login page shows both "Login with Google" and local login
      OIDC_SIGNUP_ENABLED: "false"     # only existing Mealie users (matched by email) can sign in
      OIDC_SCOPES_OVERRIDE: "openid profile email"
    secrets:
      - tinyauth_mealie_oidc_secret
    labels:
      - traefik.enable=true
      - traefik.docker.network=t3_proxy
      - traefik.http.routers.mealie-rtr.entrypoints=websecure
      - traefik.http.routers.mealie-rtr.rule=Host(`${MEALIE_SUBDOMAIN}.${DOMAINNAME_1}`)
      - traefik.http.routers.mealie-rtr.middlewares=chain-no-auth@file
      - traefik.http.routers.mealie-rtr.service=mealie-svc
      - traefik.http.services.mealie-svc.loadbalancer.server.port=9000
