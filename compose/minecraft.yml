services:
  gtnh:
    container_name: gtnh
    image: itzg/minecraft-server:java25@sha256:2fe790e54fc0138ab9f011b38473c11161984b911d32ebfd6877f7411f736937
    restart: unless-stopped
    tty: true
    stdin_open: true
    stop_grace_period: 3m
    security_opt:
      - no-new-privileges:true
    networks:
      default:
    ports:
      - ${GTNH_PORT}:25565/tcp
    volumes:
      - ${DOCKERDIR}/appdata/gtnh:/data
    environment:
      TZ: ${TZ}
      EULA: "TRUE"
      TYPE: "GTNH"
      GTNH_PACK_VERSION: "2.8.4"
      MEMORY: ${GTNH_MEMORY}
      MAX_PLAYERS: ${GTNH_MAX_PLAYERS}
      MOTD: ${GTNH_MOTD}
      MAX_TICK_TIME: "-1"
      USE_AIKAR_FLAGS: "false"
      ONLINE_MODE: "true"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${GTNH_RCON_PASSWORD}
      ENABLE_WHITELIST: "false"
    deploy:
      resources:
        limits:
          memory: 32G
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "localhost"]
      interval: 30s
      timeout: 10s
      start_period: 1200s
      retries: 5
