########################################
# udms — Ultimate Docker Media Server v2
# Entry point: includes service files from ./compose/
########################################

########################################
# NETWORKS
########################################
networks:
  default:
    name: udms_default
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1

  t3_proxy:
    name: t3_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24
          gateway: 192.168.90.1

  socket_proxy:
    name: socket_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.91.0/24
          gateway: 192.168.91.1
    internal: true   # No external connectivity — socket access only

  downloads:
    name: downloads
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1

########################################
# SECRETS
########################################
secrets:
  cf_dns_api_token:
    file: ${DOCKERDIR}/secrets/cf_dns_api_token
  cf_ddns_api_token:
    file: ${DOCKERDIR}/secrets/cf_ddns_api_token
  basic_auth_credentials:
    file: ${DOCKERDIR}/secrets/basic_auth_credentials
  plex_claim:
    file: ${DOCKERDIR}/secrets/plex_claim
  surfshark_wg_private_key:
    file: ${DOCKERDIR}/secrets/surfshark_wg_private_key
  authelia_jwt_secret:
    file: ${DOCKERDIR}/secrets/authelia_jwt_secret
  authelia_session_secret:
    file: ${DOCKERDIR}/secrets/authelia_session_secret
  authelia_storage_encryption_key:
    file: ${DOCKERDIR}/secrets/authelia_storage_encryption_key
  authelia_google_client_id:
    file: ${DOCKERDIR}/secrets/authelia_google_client_id
  authelia_google_client_secret:
    file: ${DOCKERDIR}/secrets/authelia_google_client_secret
  authelia_oidc_hmac_secret:
    file: ${DOCKERDIR}/secrets/authelia_oidc_hmac_secret
  authelia_oidc_issuer_private_key:
    file: ${DOCKERDIR}/secrets/authelia_oidc_issuer_private_key
  diun_discord_webhook:
    file: ${DOCKERDIR}/secrets/diun_discord_webhook
  mealie_oidc_client_secret:
    file: ${DOCKERDIR}/secrets/mealie_oidc_client_secret
  restic_password:
    file: ${DOCKERDIR}/secrets/restic_password

  # tinyauth (2026-10-11)
  google_oauth_client_secret:
    file: ${DOCKERDIR}/secrets/google_oauth_client_secret
  tinyauth_mealie_oidc_secret:
    file: ${DOCKERDIR}/secrets/tinyauth_mealie_oidc_secret
  tinyauth_users:
    file: ${DOCKERDIR}/secrets/tinyauth_users

########################################
# SERVICES — included from compose/*.yml
########################################
include:
  # --- CORE INFRA ---
  - compose/socket-proxy.yml
  - compose/traefik.yml
#  - compose/authelia.yml   # removed 2026-10-11: replaced by tinyauth (config kept in appdata/authelia)
  - compose/tinyauth.yml
  - compose/crowdsec.yml
  - compose/cloudflare-ddns.yml

  # --- VPN / DOWNLOADERS ---
  - compose/gluetun.yml
  - compose/qbittorrent.yml
  - compose/sabnzbd.yml

  # --- *ARR SUITE ---
  - compose/prowlarr.yml
  - compose/sonarr.yml
  - compose/radarr.yml
  - compose/lidarr.yml
  - compose/bazarr.yml
  - compose/flaresolverr.yml
  - compose/unpackerr.yml

  # --- MEDIA SERVER ---
  - compose/plex.yml
  - compose/tdarr.yml

  # --- REQUESTS & DASHBOARDS ---
  - compose/seerr.yml
  - compose/audiobookrequest.yml
  - compose/audiobookshelf.yml
  - compose/listenarr.yml
  - compose/homepage.yml
  - compose/alloy.yml        # log shipper → Loki on wyatt-mon (2026-10-11)
  - compose/attackfeed.yml   # public scrubbed attack feed + live map (2026-10-11)
  - compose/honeypot.yml     # Cowrie honeypot — isolated by homelab-honeypot-egress.service (2026-10-11)

  # --- OPS / OBSERVABILITY ---
#  - compose/diun.yml   # retired 2026-10-11: Renovate (self-hosted) replaces it; config kept in appdata/diun
#  - compose/dozzle.yml

  # --- OTHER ---
  - compose/mealie.yml
  - compose/minecraft.yml
  - compose/spiderfoot.yml
