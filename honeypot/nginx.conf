# attackfeed — serves /srv/<token>/{index.html,feed.json}. Everything else 404. No directory listing.
server {
    listen 8080;
    server_name _;
    root /srv;
    autoindex off;
    server_tokens off;
    access_log off;            # Traefik already logs every request

    location = / { return 404; }
    location ~ "^/([0-9a-f]{32})/$" { try_files /$1/index.html =404; add_header Cache-Control "no-cache"; }
    location ~ ^/([0-9a-f]{32})/feed\.json$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        try_files /$1/feed.json =404;
    }
    location / { return 404; }
}
