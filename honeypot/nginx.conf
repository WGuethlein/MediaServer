# attackfeed - serves /srv/<token>/{index.html,feed.json,live.json,insights.json,sessions/<id>.json}. Everything else 404.
server {
    listen 8080;
    server_name _;
    root /srv;
    autoindex off;
    server_tokens off;
    access_log off;            # Traefik already logs every request
    gzip on;
    gzip_vary on;
    gzip_types application/json;
    gzip_min_length 1024;

    location = / { return 404; }
    location ~ "^/([0-9a-f]{32})/$" { try_files /$1/index.html =404; add_header Cache-Control "no-cache"; }
    location ~ "^/([0-9a-f]{32})/(feed|live|insights)\.json$" {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        try_files /$1/$2.json =404;
    }
    location ~ "^/([0-9a-f]{32})/sessions/([0-9a-f]{8,32})\.json$" {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        try_files /$1/sessions/$2.json =404;
    }
    location / { return 404; }
}
